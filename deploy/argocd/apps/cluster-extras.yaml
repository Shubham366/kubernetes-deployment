# ClusterIssuers and the gp3 StorageClass (plain YAML in deploy/helm/extras).
# ACME_EMAIL is not substituted here: edit cluster-issuers.yaml or override
# with a Kustomize patch before enabling letsencrypt.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-extras
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: linux-provision
  source:
    repoURL: https://github.com/ORG/REPO.git
    targetRevision: main
    path: linux-provision/deploy/helm/extras
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

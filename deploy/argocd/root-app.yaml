# App of apps: Argo CD watches deploy/argocd/apps and creates every child
# Application found there. REPO_URL / TARGET_REVISION / REPO_PATH_PREFIX are
# substituted by install-argocd.sh (defaults in that script).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: linux-provision-root
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: linux-provision
  source:
    repoURL: ${REPO_URL}
    targetRevision: ${TARGET_REVISION}
    path: ${REPO_PATH_PREFIX}/argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

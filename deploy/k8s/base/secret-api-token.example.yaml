# EXAMPLE ONLY. Do not put a real token here. Create the real Secret with:
#   kubectl -n provisioner create secret generic provisioner-api-token \
#     --from-literal=PROVISIONER_API_TOKEN="$(openssl rand -hex 32)"
# or seal it for git with: deploy/k8s/seal-secrets.sh
apiVersion: v1
kind: Secret
metadata:
  name: provisioner-api-token
  namespace: provisioner
type: Opaque
stringData:
  PROVISIONER_API_TOKEN: REPLACE_ME

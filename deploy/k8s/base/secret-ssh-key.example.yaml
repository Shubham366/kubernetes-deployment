# EXAMPLE ONLY. Create the real Secret from your private key file:
#   kubectl -n provisioner create secret generic provisioner-ssh-key \
#     --from-file=id_ed25519=$HOME/.ssh/provisioner_ed25519
# The key is mounted read-only at /etc/provisioner/ssh/id_ed25519 (mode 0400).
apiVersion: v1
kind: Secret
metadata:
  name: provisioner-ssh-key
  namespace: provisioner
type: Opaque
stringData:
  id_ed25519: REPLACE_ME

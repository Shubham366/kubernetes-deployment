apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: provisioner
  namespace: provisioner
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: provisioner
  policyTypes: [Ingress, Egress]
  ingress:
    # only the ingress controller (and Prometheus) may reach the API
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8080
          protocol: TCP
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # SSH to the managed Linux hosts (anywhere outside the cluster), plus
    # HTTPS for package mirrors reached through the hosts is not needed here.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: [100.64.0.0/10, 10.42.0.0/16]
      ports:
        - port: 22
          protocol: TCP

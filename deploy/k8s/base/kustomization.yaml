apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: provisioner
labels:
  - pairs:
      app.kubernetes.io/part-of: linux-provision
    includeSelectors: false
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - networkpolicy.yaml
  - pdb.yaml
# Secrets are deliberately NOT listed: create them out of band
# (see secret-*.example.yaml) or commit SealedSecrets in an overlay.

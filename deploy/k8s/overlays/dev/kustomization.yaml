apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: provisioner
resources:
  - ../../base
labels:
  - pairs:
      environment: dev
    includeSelectors: false
images:
  - name: ghcr.io/org/linux-provision
    newTag: dev
patches:
  - path: patch-dev.yaml
  - path: patch-ingress.yaml
  - path: patch-pvc.yaml
configMapGenerator:
  - name: provisioner-config
    namespace: provisioner
    behavior: merge
    literals:
      - PROVISIONER_LOG_LEVEL=DEBUG
      # dev never touches real hosts
      - PROVISIONER_DRY_RUN=true
      - PROVISIONER_SIMULATE_WHEN_ANSIBLE_MISSING=true

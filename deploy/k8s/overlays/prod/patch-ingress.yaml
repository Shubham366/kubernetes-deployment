apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: provisioner
  namespace: provisioner
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts: [provisioner.example.com]
      secretName: provisioner-tls
  rules:
    - host: provisioner.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: provisioner
                port:
                  name: http

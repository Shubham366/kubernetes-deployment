apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: provisioner
resources:
  - ../../base
  # SealedSecrets produced by deploy/k8s/seal-secrets.sh go here, e.g.:
  # - sealed-api-token.yaml
  # - sealed-ssh-key.yaml
labels:
  - pairs:
      environment: prod
    includeSelectors: false
images:
  - name: ghcr.io/ORG/linux-provision
    newTag: "0.1.0"
patches:
  - path: patch-ingress.yaml
configMapGenerator:
  - name: provisioner-config
    namespace: provisioner
    behavior: merge
    literals:
      - PROVISIONER_LOG_LEVEL=INFO
      - PROVISIONER_DRY_RUN=false

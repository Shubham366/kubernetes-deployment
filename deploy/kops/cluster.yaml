# kOps cluster template. Rendered with envsubst by create-cluster.sh.
# Variables come from env.sh.
apiVersion: kops.k8s.io/v1alpha2
kind: Cluster
metadata:
  name: ${KOPS_CLUSTER_NAME}
spec:
  api:
    loadBalancer:
      class: Network
      type: Public
  authorization:
    rbac: {}
  channel: stable
  cloudProvider: aws
  configBase: ${KOPS_STATE_STORE}/${KOPS_CLUSTER_NAME}
  etcdClusters:
    - name: main
      manager:
        backupRetentionDays: 7
      etcdMembers:
        - instanceGroup: control-plane-${KOPS_ZONES}
          name: a
          volumeSize: 20
    - name: events
      etcdMembers:
        - instanceGroup: control-plane-${KOPS_ZONES}
          name: a
          volumeSize: 20
  iam:
    allowContainerRegistry: true
    legacy: false
    useServiceAccountExternalPermissions: true
  kubelet:
    anonymousAuth: false
  kubernetesApiAccess:
    - ${KOPS_ADMIN_ACCESS}
  kubernetesVersion: ${KOPS_K8S_VERSION}
  networkCIDR: ${KOPS_NETWORK_CIDR}
  networking:
    calico: {}
  nonMasqueradeCIDR: 100.64.0.0/10
  sshAccess:
    - ${KOPS_ADMIN_ACCESS}
  subnets:
    - cidr: 10.42.32.0/19
      name: ${KOPS_ZONES}
      type: Public
      zone: ${KOPS_ZONES}
  topology:
    dns:
      type: Public
  cloudLabels:
    project: linux-provision
    managed-by: kops
  certManager:
    enabled: false
  metricsServer:
    enabled: false
  awsLoadBalancerController:
    enabled: false
  serviceAccountIssuerDiscovery:
    discoveryStore: ${KOPS_STATE_STORE}/${KOPS_CLUSTER_NAME}/discovery
    enableAWSOIDCProvider: true
---
apiVersion: kops.k8s.io/v1alpha2
kind: InstanceGroup
metadata:
  labels:
    kops.k8s.io/cluster: ${KOPS_CLUSTER_NAME}
  name: control-plane-${KOPS_ZONES}
spec:
  image: ssd/ubuntu-noble-24.04-amd64-server
  machineType: ${KOPS_CONTROL_PLANE_SIZE}
  maxSize: ${KOPS_CONTROL_PLANE_COUNT}
  minSize: ${KOPS_CONTROL_PLANE_COUNT}
  role: ControlPlane
  rootVolumeSize: 32
  rootVolumeType: gp3
  subnets:
    - ${KOPS_ZONES}
---
apiVersion: kops.k8s.io/v1alpha2
kind: InstanceGroup
metadata:
  labels:
    kops.k8s.io/cluster: ${KOPS_CLUSTER_NAME}
  name: nodes-${KOPS_ZONES}
spec:
  image: ssd/ubuntu-noble-24.04-amd64-server
  machineType: ${KOPS_NODE_SIZE}
  maxSize: ${KOPS_NODE_COUNT}
  minSize: ${KOPS_NODE_COUNT}
  role: Node
  rootVolumeSize: ${KOPS_NODE_VOLUME_GB}
  rootVolumeType: gp3
  subnets:
    - ${KOPS_ZONES}
  nodeLabels:
    workload: general

# Chart: oci://registry-1.docker.io/bitnamicharts/sealed-secrets (the old
# bitnami-labs.github.io Helm repo is gone).
# Why sealed-secrets and not external-secrets: the only secrets are one API
# token and one SSH key. Sealed Secrets lets them live encrypted in git and be
# synced by Argo CD with no AWS Secrets Manager, IAM role or extra cost, and it
# works identically on kind. External Secrets would be the choice once secrets
# are owned by an external store.
fullnameOverride: sealed-secrets-controller
resources:
  requests: {cpu: 20m, memory: 64Mi}
  limits: {memory: 128Mi}
metrics:
  serviceMonitor:
    enabled: false

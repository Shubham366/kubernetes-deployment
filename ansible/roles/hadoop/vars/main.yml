---
# =============================================================================
# hadoop role - derived values (not meant to be overridden)
#
# All topology is computed from the inventory groups generated by the backend.
# Groups may be empty or missing entirely, hence groups.get(..., []).
# Only *inventory* variables of other hosts are used here (never their facts),
# so everything still resolves when the run is limited with target_hosts.
# =============================================================================

# -----------------------------------------------------------------------------
# Input normalisation: the backend sends JSON lists, but tolerate a
# comma-separated string and null as well.
# -----------------------------------------------------------------------------
hadoop_dn_dirs: >-
  {{ (hadoop_data_dirs.split(',') | map('trim') | list) if hadoop_data_dirs is string
     else (hadoop_data_dirs | default(['/data/hadoop/dn'], true)) }}
hadoop_nn_dirs: >-
  {{ (hadoop_name_dirs.split(',') | map('trim') | list) if hadoop_name_dirs is string
     else (hadoop_name_dirs | default(['/data/hadoop/nn'], true)) }}
hadoop_new_node_list: >-
  {{ (hadoop_new_nodes.split(',') | map('trim') | list) if hadoop_new_nodes is string
     else (hadoop_new_nodes | default([], true)) }}
hadoop_decom_node_list: >-
  {{ (hadoop_decommission_nodes.split(',') | map('trim') | list) if hadoop_decommission_nodes is string
     else (hadoop_decommission_nodes | default([], true)) }}

# -----------------------------------------------------------------------------
# Topology
# -----------------------------------------------------------------------------
# NameNodes: hadoop_namenode first, then hadoop_standby_namenode. The first
# entry is the "primary": it is the one that gets formatted on first install,
# hosts the SecondaryNameNode (non-HA) and runs cluster-wide admin commands.
hadoop_nn_hosts: "{{ (groups.get('hadoop_namenode', []) + groups.get('hadoop_standby_namenode', [])) | unique | list }}"
hadoop_primary_nn: "{{ hadoop_nn_hosts | first | default('') }}"
hadoop_jn_hosts: "{{ groups.get('hadoop_journalnode', []) | list }}"
hadoop_zk_hosts: "{{ groups.get('hadoop_zookeeper', []) | list }}"
hadoop_rm_hosts: "{{ groups.get('hadoop_resourcemanager', []) | list }}"
hadoop_primary_rm: "{{ hadoop_rm_hosts | first | default('') }}"
hadoop_dn_hosts: "{{ groups.get('hadoop_datanode', []) | list }}"
hadoop_jhs_hosts: "{{ groups.get('hadoop_historyserver', []) | list }}"

# There is no "hadoop" meta group: build the cluster by union.
hadoop_all_hosts: >-
  {{ (hadoop_nn_hosts + hadoop_jn_hosts + hadoop_zk_hosts + hadoop_rm_hosts
      + hadoop_dn_hosts + hadoop_jhs_hosts) | unique | list }}

hadoop_ha: "{{ hadoop_ha_enabled | default(false) | bool }}"
# YARN is only deployed when at least one ResourceManager is declared.
hadoop_yarn_enabled: "{{ hadoop_rm_hosts | length > 0 }}"
# ResourceManager HA switches on automatically with 2+ RMs (needs ZooKeeper).
hadoop_rm_ha: "{{ (hadoop_rm_hosts | length > 1) and (hadoop_zk_hosts | length > 0) }}"

# Workers that should be listed in the workers file. Nodes being
# decommissioned are dropped from it as part of the decommission run.
hadoop_worker_hosts: >-
  {{ hadoop_dn_hosts | difference(hadoop_decom_node_list if hadoop_action == 'decommission' else []) }}

# scale_out only (re)configures the new nodes; every other action touches all.
hadoop_node_selected: "{{ hadoop_action != 'scale_out' or inventory_hostname in hadoop_new_node_list }}"

# -----------------------------------------------------------------------------
# Node naming
#
# Hadoop wants every node to be reachable under one stable name from every
# other node. For each inventory host we derive:
#   name        - what goes into the Hadoop configs
#   ip          - IPv4 address, when known
#   hosts_entry - whether "<ip> <name>" must be written to /etc/hosts
#
# Rules:
#   * ansible_host (or the optional host var hadoop_node_ip, e.g. a private
#     address when ansible_host is a public/NAT one) is an IPv4 literal and the
#     inventory name is a real name -> use the inventory name, lower-cased and
#     with "_" replaced by "-" (underscores break java.net.URI), and publish it
#     through /etc/hosts on every node.
#   * otherwise (ansible_host is a DNS name, or the inventory name is itself an
#     IP) -> use that address as-is and rely on DNS.
#
# The leading "J" keeps Ansible from auto-converting the JSON string into a
# dict before from_json sees it.
# -----------------------------------------------------------------------------
hadoop_ipv4_regex: '^[0-9]{1,3}(\.[0-9]{1,3}){3}$'
hadoop_node_map_json: >-
  J{%- set m = {} -%}
  {%- for h in hadoop_all_hosts -%}
  {%-   set hv = hostvars[h] | default({}) -%}
  {%-   set raw = (hv.hadoop_node_ip | default(hv.ansible_host | default(h, true), true)) | string -%}
  {%-   if (raw is match(hadoop_ipv4_regex)) and not (h is match(hadoop_ipv4_regex)) -%}
  {%-     set _ = m.update({h: {'name': h | lower | regex_replace('_', '-'), 'ip': raw, 'hosts_entry': true}}) -%}
  {%-   else -%}
  {%-     set _ = m.update({h: {'name': raw, 'ip': (raw if raw is match(hadoop_ipv4_regex) else ''), 'hosts_entry': false}}) -%}
  {%-   endif -%}
  {%- endfor -%}
  {{ m | to_json }}
hadoop_node_map: "{{ hadoop_node_map_json[1:] | from_json }}"

hadoop_self_addr: "{{ hadoop_node_map[inventory_hostname].name }}"
hadoop_nn_addrs: "{{ hadoop_nn_hosts | map('extract', hadoop_node_map) | map(attribute='name') | list }}"
hadoop_jn_addrs: "{{ hadoop_jn_hosts | map('extract', hadoop_node_map) | map(attribute='name') | list }}"
hadoop_zk_addrs: "{{ hadoop_zk_hosts | map('extract', hadoop_node_map) | map(attribute='name') | list }}"
hadoop_rm_addrs: "{{ hadoop_rm_hosts | map('extract', hadoop_node_map) | map(attribute='name') | list }}"
hadoop_jhs_addrs: "{{ hadoop_jhs_hosts | map('extract', hadoop_node_map) | map(attribute='name') | list }}"
hadoop_worker_addrs: "{{ hadoop_worker_hosts | map('extract', hadoop_node_map) | map(attribute='name') | list }}"
hadoop_primary_nn_addr: "{{ hadoop_node_map[hadoop_primary_nn].name }}"

# Names + IPs of the nodes being decommissioned (exclude files match either).
hadoop_decom_entries: >-
  {{ ((hadoop_decom_node_list | map('extract', hadoop_node_map) | map(attribute='name') | list)
      + (hadoop_decom_node_list | map('extract', hadoop_node_map) | map(attribute='ip') | select | list)) | unique | list }}
hadoop_new_node_addrs: "{{ hadoop_new_node_list | map('extract', hadoop_node_map) | map(attribute='name') | list }}"

# -----------------------------------------------------------------------------
# Endpoints
# -----------------------------------------------------------------------------
hadoop_default_fs: >-
  hdfs://{{ hadoop_cluster_name if hadoop_ha | bool
            else (hadoop_primary_nn_addr ~ ':' ~ hadoop_ports.namenode_rpc) }}
hadoop_zk_quorum: >-
  {{ hadoop_zk_addrs | map('regex_replace', '$', ':' ~ hadoop_ports.zk_client) | join(',') }}
hadoop_qjournal_uri: >-
  qjournal://{{ hadoop_jn_addrs | map('regex_replace', '$', ':' ~ hadoop_ports.journal_rpc) | join(';') }}/{{ hadoop_cluster_name }}
hadoop_cluster_id: "CID-{{ hadoop_cluster_name }}"

# -----------------------------------------------------------------------------
# Paths
# -----------------------------------------------------------------------------
hadoop_home: "{{ hadoop_install_dir }}/hadoop-{{ hadoop_version }}"
hadoop_current: "{{ hadoop_install_dir }}/current"
hadoop_dist_dir: "{{ hadoop_install_dir }}/dist"
# Written after a successful format/bootstrap; a second line of defence
# (besides <name_dir>/current/VERSION) against ever reformatting a NameNode.
hadoop_format_marker: "{{ hadoop_install_dir }}/.namenode_formatted"
hadoop_exclude_file: "{{ hadoop_conf_dir }}/dfs.exclude"
hadoop_yarn_exclude_file: "{{ hadoop_conf_dir }}/yarn.exclude"
hadoop_ssh_key_file: "{{ hadoop_user_home }}/.ssh/id_rsa"

# aarch64 builds are published as hadoop-<v>-aarch64.tar.gz from 3.3.1 on.
hadoop_tarball: >-
  hadoop-{{ hadoop_version }}{{ '-aarch64' if (ansible_architecture | default('x86_64')) == 'aarch64'
  and (hadoop_version is version('3.3.1', '>=')) else '' }}.tar.gz
hadoop_effective_download_url: >-
  {{ (hadoop_download_url | default('', true))
     or (hadoop_mirror ~ '/hadoop/common/hadoop-' ~ hadoop_version ~ '/' ~ hadoop_tarball) }}
hadoop_effective_checksum: >-
  {{ '' if not (hadoop_checksum | default('', true))
     else (hadoop_checksum if ':' in hadoop_checksum else 'sha512:' ~ hadoop_checksum) }}

hadoop_zk_home: "{{ hadoop_zookeeper_install_dir }}/apache-zookeeper-{{ hadoop_zookeeper_version }}-bin"
hadoop_zk_current: "{{ hadoop_zookeeper_install_dir }}/current"
hadoop_zk_tarball: "apache-zookeeper-{{ hadoop_zookeeper_version }}-bin.tar.gz"
hadoop_zk_effective_download_url: >-
  {{ (hadoop_zookeeper_download_url | default('', true))
     or (hadoop_mirror ~ '/zookeeper/zookeeper-' ~ hadoop_zookeeper_version ~ '/' ~ hadoop_zk_tarball) }}
hadoop_zk_effective_checksum: >-
  {{ '' if not (hadoop_zookeeper_checksum | default('', true))
     else (hadoop_zookeeper_checksum if ':' in hadoop_zookeeper_checksum else 'sha512:' ~ hadoop_zookeeper_checksum) }}
# ZooKeeper server id: position in the hadoop_zookeeper group (1-based) unless
# the host var hadoop_zookeeper_myid pins it. Never reorder / remove hosts in
# the middle of that group on a live ensemble without pinning the ids.
hadoop_zk_myid: >-
  {{ hadoop_zookeeper_myid | default(hadoop_zk_hosts.index(inventory_hostname) + 1
     if inventory_hostname in hadoop_zk_hosts else 0) }}

# -----------------------------------------------------------------------------
# CLI shortcuts (always run as hadoop_user)
# -----------------------------------------------------------------------------
hadoop_hdfs: "{{ hadoop_current }}/bin/hdfs --config {{ hadoop_conf_dir }}"
hadoop_yarn: "{{ hadoop_current }}/bin/yarn --config {{ hadoop_conf_dir }}"
hadoop_mapred: "{{ hadoop_current }}/bin/mapred --config {{ hadoop_conf_dir }}"

# -----------------------------------------------------------------------------
# Sizing
# -----------------------------------------------------------------------------
hadoop_nm_memory_mb: >-
  {{ (hadoop_yarn_nodemanager_memory_mb | default(0, true) | int)
     or ([((ansible_memtotal_mb | default(4096) | int) * 0.75) | int, 1024] | max) }}
hadoop_nm_vcores: >-
  {{ (hadoop_yarn_nodemanager_vcores | default(0, true) | int)
     or (ansible_processor_vcpus | default(2) | int) }}

# -----------------------------------------------------------------------------
# Daemons
#
# One systemd unit per daemon. "port" is the port probed after a (re)start.
# "zookeeper" is listed so start/stop/restart/status can treat it uniformly,
# but its unit comes from its own template (templates/zookeeper.service.j2).
# -----------------------------------------------------------------------------
hadoop_daemon_defs:
  zookeeper:
    unit: zookeeper
    desc: ZooKeeper
    port: "{{ hadoop_ports.zk_client }}"
  journalnode:
    unit: hadoop-journalnode
    desc: HDFS JournalNode
    bin: hdfs
    sub: journalnode
    port: "{{ hadoop_ports.journal_rpc }}"
  namenode:
    unit: hadoop-namenode
    desc: HDFS NameNode
    bin: hdfs
    sub: namenode
    port: "{{ hadoop_ports.namenode_rpc }}"
  zkfc:
    unit: hadoop-zkfc
    desc: HDFS ZK Failover Controller
    bin: hdfs
    sub: zkfc
    port: "{{ hadoop_ports.zkfc }}"
  secondarynamenode:
    unit: hadoop-secondarynamenode
    desc: HDFS SecondaryNameNode
    bin: hdfs
    sub: secondarynamenode
    port: "{{ hadoop_ports.secondary_http }}"
  resourcemanager:
    unit: hadoop-resourcemanager
    desc: YARN ResourceManager
    bin: yarn
    sub: resourcemanager
    port: "{{ hadoop_ports.rm_web }}"
  datanode:
    unit: hadoop-datanode
    desc: HDFS DataNode
    bin: hdfs
    sub: datanode
    port: "{{ hadoop_ports.datanode_data }}"
  nodemanager:
    unit: hadoop-nodemanager
    desc: YARN NodeManager
    bin: yarn
    sub: nodemanager
    port: "{{ hadoop_ports.nm_web }}"
  historyserver:
    unit: hadoop-historyserver
    desc: MapReduce JobHistory Server
    bin: mapred
    sub: historyserver
    port: "{{ hadoop_ports.jhs_rpc }}"

# Dependency order for starting; stopping uses the reverse.
hadoop_daemon_order:
  - zookeeper
  - journalnode
  - namenode
  - zkfc
  - secondarynamenode
  - resourcemanager
  - datanode
  - nodemanager
  - historyserver

# Daemons this particular host runs, in start order.
hadoop_host_daemons: >-
  {{ (['zookeeper'] if inventory_hostname in hadoop_zk_hosts else [])
   + (['journalnode'] if (hadoop_ha | bool and inventory_hostname in hadoop_jn_hosts) else [])
   + (['namenode'] if inventory_hostname in hadoop_nn_hosts else [])
   + (['zkfc'] if (hadoop_ha | bool and inventory_hostname in hadoop_nn_hosts) else [])
   + (['secondarynamenode'] if (not (hadoop_ha | bool) and inventory_hostname == hadoop_primary_nn) else [])
   + (['resourcemanager'] if inventory_hostname in hadoop_rm_hosts else [])
   + (['datanode'] if inventory_hostname in hadoop_dn_hosts else [])
   + (['nodemanager'] if (hadoop_yarn_enabled | bool and inventory_hostname in hadoop_dn_hosts) else [])
   + (['historyserver'] if inventory_hostname in hadoop_jhs_hosts else []) }}

# Every Hadoop unit name, regardless of topology (used by uninstall).
hadoop_all_units: "{{ hadoop_daemon_order | difference(['zookeeper']) | map('extract', hadoop_daemon_defs) | map(attribute='unit') | list }}"

# 'restarted' when "install" is re-run and the configuration changed
# (hadoop_config_changed is set by the "hadoop config changed" handler).
hadoop_start_state: >-
  {{ 'restarted' if (hadoop_config_changed | default(false) | bool)
     and (hadoop_restart_on_config_change | bool) and hadoop_action == 'install' else 'started' }}
hadoop_zk_start_state: >-
  {{ 'restarted' if (hadoop_zk_config_changed | default(false) | bool)
     and (hadoop_restart_on_config_change | bool) and hadoop_action == 'install' else 'started' }}

# Local storage each host needs, by role (created in user.yml, checked in
# preflight.yml, optionally purged in uninstall.yml).
hadoop_host_storage_dirs: >-
  {{ ((hadoop_nn_dirs if inventory_hostname in hadoop_nn_hosts else [])
    + ([hadoop_journal_dir] if (hadoop_ha | bool and inventory_hostname in hadoop_jn_hosts) else [])
    + (hadoop_checkpoint_dirs if (not (hadoop_ha | bool) and inventory_hostname == hadoop_primary_nn) else [])
    + (hadoop_dn_dirs if inventory_hostname in hadoop_dn_hosts else [])
    + ((hadoop_yarn_local_dirs + hadoop_yarn_log_dirs) if (hadoop_yarn_enabled | bool and inventory_hostname in hadoop_dn_hosts) else [])
    + [hadoop_tmp_dir]) | unique | list }}
# Same, but for every role (uninstall must also clean up after topology changes).
hadoop_all_storage_dirs: >-
  {{ (hadoop_nn_dirs + [hadoop_journal_dir] + hadoop_checkpoint_dirs + hadoop_dn_dirs
      + hadoop_yarn_local_dirs + hadoop_yarn_log_dirs + [hadoop_tmp_dir]) | unique | list }}

# -----------------------------------------------------------------------------
# Firewall: inbound TCP ports per daemon
# -----------------------------------------------------------------------------
hadoop_daemon_ports:
  zookeeper:
    - "{{ hadoop_ports.zk_client }}"
    - "{{ hadoop_ports.zk_peer }}"
    - "{{ hadoop_ports.zk_election }}"
  journalnode:
    - "{{ hadoop_ports.journal_rpc }}"
    - "{{ hadoop_ports.journal_http }}"
  namenode:
    - "{{ hadoop_ports.namenode_rpc }}"
    - "{{ hadoop_ports.namenode_http }}"
  zkfc:
    - "{{ hadoop_ports.zkfc }}"
  secondarynamenode:
    - "{{ hadoop_ports.secondary_http }}"
  resourcemanager:
    - "{{ hadoop_ports.rm_scheduler }}"
    - "{{ hadoop_ports.rm_tracker }}"
    - "{{ hadoop_ports.rm_client }}"
    - "{{ hadoop_ports.rm_admin }}"
    - "{{ hadoop_ports.rm_web }}"
  datanode:
    - "{{ hadoop_ports.datanode_data }}"
    - "{{ hadoop_ports.datanode_http }}"
    - "{{ hadoop_ports.datanode_ipc }}"
  nodemanager:
    - "{{ hadoop_ports.nm_localizer }}"
    - "{{ hadoop_ports.nm_ipc }}"
    - "{{ hadoop_ports.nm_web }}"
    - "{{ hadoop_ports.shuffle }}"
    - "{{ hadoop_mapred_am_port_range }}"
  historyserver:
    - "{{ hadoop_ports.jhs_rpc }}"
    - "{{ hadoop_ports.jhs_web }}"
    - "{{ hadoop_ports.jhs_admin }}"
hadoop_host_firewall_ports: >-
  {{ hadoop_host_daemons | map('extract', hadoop_daemon_ports) | flatten | map('string') | unique | list }}

# -----------------------------------------------------------------------------
# OS specifics
# -----------------------------------------------------------------------------
hadoop_supported_os_families:
  - Debian
  - RedHat

# psmisc provides fuser (needed by the sshfence HA fencer); acl lets Ansible
# become the unprivileged hadoop user; nc is used by status checks.
hadoop_os_packages:
  Debian:
    - tar
    - gzip
    - curl
    - rsync
    - openssh-server
    - openssh-client
    - procps
    - psmisc
    - net-tools
    - netcat-openbsd
    - acl
    - ca-certificates
    - libsnappy1v5
  RedHat:
    - tar
    - gzip
    - curl
    - rsync
    - openssh-server
    - openssh-clients
    - procps-ng
    - psmisc
    - net-tools
    - nmap-ncat
    - acl
    - which
    - ca-certificates
    - snappy
    - policycoreutils

hadoop_chrony_service:
  Debian: chrony
  RedHat: chronyd

# RedHat calls Java 8 "1.8.0"; everything newer uses the plain major version.
hadoop_java_rh_label: "{{ '1.8.0' if (hadoop_java_version | int) == 8 else (hadoop_java_version | int) }}"
hadoop_java_default_package:
  Debian: "openjdk-{{ hadoop_java_version | int }}-jdk-headless"
  RedHat: "java-{{ hadoop_java_rh_label }}-openjdk-devel"
hadoop_java_effective_package: >-
  {{ (hadoop_java_package | default('', true)) or hadoop_java_default_package[ansible_os_family] }}
hadoop_java_deb_arch: "{{ 'arm64' if (ansible_architecture | default('x86_64')) == 'aarch64' else 'amd64' }}"
hadoop_java_home_candidates:
  Debian:
    - "/usr/lib/jvm/java-{{ hadoop_java_version | int }}-openjdk-{{ hadoop_java_deb_arch }}"
    - "/usr/lib/jvm/java-1.{{ hadoop_java_version | int }}.0-openjdk-{{ hadoop_java_deb_arch }}"
  RedHat:
    - "/usr/lib/jvm/java-{{ hadoop_java_rh_label }}-openjdk"
    - "/usr/lib/jvm/java-{{ hadoop_java_rh_label }}"
    - "/usr/lib/jvm/jre-{{ hadoop_java_rh_label }}-openjdk"
hadoop_java_glob_label: "{{ hadoop_java_rh_label if ansible_os_family == 'RedHat' else (hadoop_java_version | int) }}"

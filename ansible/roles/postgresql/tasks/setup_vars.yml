---
# Gathers facts (the playbook's plays do not) and loads the OS specific
# layout: service name, data/config/bin directories, package names.
# Included at the top of every entry-point task file; cheap and idempotent.

- name: Vars | gather facts
  ansible.builtin.setup:
  when: ansible_os_family is not defined

- name: Vars | supported OS family
  ansible.builtin.assert:
    that:
      - ansible_os_family in ['Debian', 'RedHat']
    fail_msg: >-
      Unsupported OS family '{{ ansible_os_family }}' on {{ inventory_hostname }}
      (declared_os={{ declared_os | default('n/a') }}). Supported: Debian/Ubuntu and RHEL/CentOS/Rocky/Alma.
    quiet: true

- name: Vars | load OS family variables
  ansible.builtin.include_vars:
    file: "{{ ansible_os_family }}.yml"

# PGDG stopped building for EL7 after PostgreSQL 15.
- name: Vars | version available for this OS release
  ansible.builtin.assert:
    that:
      - (ansible_distribution_major_version | int) >= 8 or (__pg_version | int) <= 15
    fail_msg: >-
      PostgreSQL {{ __pg_version }} is not available from PGDG for EL{{ ansible_distribution_major_version }}
      (last supported major version there is 15).
    quiet: true
  when:
    - ansible_os_family == 'RedHat'
    - postgresql_action in ['install', 'add_replica']

- name: Vars | data directory sanity
  ansible.builtin.assert:
    that:
      - __pg_data_dir is match('^/[^/]+/.+')
    fail_msg: "Refusing to work with data directory '{{ __pg_data_dir }}' (must be an absolute path at least two levels deep)"
    quiet: true
